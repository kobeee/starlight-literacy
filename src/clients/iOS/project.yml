name: StarlightLiteracy
options:
  bundleIdPrefix: cc.escapemobius
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: 1
targets:
  StarlightLiteracy:
    type: application
    platform: iOS
    sources:
      - path: StarlightLiteracy
        excludes:
          - Resources/Audio
      - path: StarlightLiteracy/Resources/Audio
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.escapemobius.starlightliteracy.claude
        INFOPLIST_FILE: StarlightLiteracy/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: StarlightLiteracy/Info.plist
      properties:
        CFBundleDisplayName: 星光识字
        NSMicrophoneUsageDescription: 跟读练习需要录下孩子的声音，只在本机和老师声音做波形对比，不上传。
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchBrand
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  StarlightLiteracyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StarlightLiteracyTests
    dependencies:
      - target: StarlightLiteracy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.escapemobius.starlightliteracy.claude.tests
        GENERATE_INFOPLIST_FILE: "YES"
  StarlightLiteracyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StarlightLiteracyUITests
    dependencies:
      - target: StarlightLiteracy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.escapemobius.starlightliteracy.claude.uitests
        GENERATE_INFOPLIST_FILE: "YES"
