<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recognition Sprite Stage Template</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      margin: 0;
      background: #f6ead5;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8ecd8;
    }

    .plate,
    .sprite-frame,
    .glyph-card {
      position: absolute;
      inset: 0;
    }

    .plate {
      object-fit: cover;
      width: 100%;
      height: 100%;
    }

    .sprite {
      position: absolute;
      left: 120px;
      top: 980px;
      width: 240px;
      height: 240px;
    }

    .sprite-frame {
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
    }

    .glyph-card {
      display: grid;
      place-items: center;
      color: #5a3422;
      text-align: center;
      opacity: 0;
    }

    .glyph {
      font-size: 260px;
      font-weight: 800;
      line-height: 1;
    }

    .pinyin {
      margin-top: 20px;
      font-size: 58px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div
    id="recognition-sprite-template"
    class="stage"
    data-composition-id="recognition-sprite-template"
    data-width="1080"
    data-height="1920"
    data-duration="5.8"
  >
    <img
      class="clip plate"
      data-start="0"
      data-duration="5.8"
      data-track-index="0"
      src="../assets/unit-01/yi/yi-stage-bg-v1.png"
      alt=""
    />

    <!-- Replace frame src values from a validated sprite manifest. -->
    <div
      class="clip sprite"
      data-start="0.4"
      data-duration="1.2"
      data-track-index="1"
      aria-hidden="true"
    >
      <img class="sprite-frame" src="../assets/unit-01/yi/sprites/rabbit/hop/frame-000.png" alt="" />
      <img class="sprite-frame" src="../assets/unit-01/yi/sprites/rabbit/hop/frame-001.png" alt="" />
      <img class="sprite-frame" src="../assets/unit-01/yi/sprites/rabbit/hop/frame-002.png" alt="" />
      <img class="sprite-frame" src="../assets/unit-01/yi/sprites/rabbit/hop/frame-003.png" alt="" />
    </div>

    <div
      class="clip glyph-card"
      data-start="3.8"
      data-duration="2"
      data-track-index="2"
    >
      <div>
        <div class="glyph">一</div>
        <div class="pinyin">yi</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};

    const timeline = gsap.timeline({ paused: true });
    const frames = gsap.utils.toArray(".sprite-frame");

    timeline.set(frames, { opacity: 0 }, 0);
    frames.forEach((frame, index) => {
      timeline.set(frame, { opacity: 1 }, 0.4 + index * 0.12);
      timeline.set(frame, { opacity: 0 }, 0.4 + (index + 1) * 0.12);
    });
    timeline.set(frames[frames.length - 1], { opacity: 1 }, 0.4 + frames.length * 0.12);
    timeline.fromTo(".sprite", { y: 0 }, { y: -46, duration: 0.34, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.4);
    timeline.to(".glyph-card", { opacity: 1, duration: 0.5, ease: "sine.out" }, 3.8);

    window.__timelines["recognition-sprite-template"] = timeline;
  </script>
</body>
</html>
