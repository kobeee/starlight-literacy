<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <title>一 - Agent Pipeline Test</title>
  <script src="assets/runtime/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      background: #f8ecd8;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #5a3422;
    }
    .stage {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #f8ecd8;
    }
    .clip { position: absolute; }
    .plate {
      inset: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
    }
    .paper-grain {
      inset: 0;
      opacity: 0.14;
      background-image:
        radial-gradient(circle at 18% 24%, rgba(91, 61, 33, 0.11) 0 1px, transparent 1.5px),
        radial-gradient(circle at 71% 42%, rgba(91, 61, 33, 0.08) 0 1px, transparent 1.5px);
      background-size: 42px 42px, 67px 67px;
    }
    .stage-title {
      left: 0;
      top: 178px;
      width: 100%;
      text-align: center;
      font-size: 48px;
      line-height: 1.25;
      font-weight: 800;
      color: #7a570c;
    }
    .path-scene,
    .apple-scene,
    .stick-scene,
    .glyph-scene {
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .path-highlight,
    .memory-line {
      position: absolute;
      height: 30px;
      border-radius: 999px;
      transform-origin: 0 50%;
      background:
        linear-gradient(180deg, rgba(255, 247, 191, 0.85), rgba(255, 221, 85, 0.16)),
        linear-gradient(90deg, #f9c849, #dda015);
      box-shadow: 0 0 0 16px rgba(249, 200, 73, 0.12), 0 18px 24px rgba(92, 57, 21, 0.12);
    }
    .path-highlight {
      left: 258px;
      top: 1099px;
      width: 564px;
    }
    .sprite {
      position: absolute;
      width: 256px;
      height: 256px;
      transform-origin: 50% 78%;
      filter: drop-shadow(0 18px 18px rgba(90, 52, 34, 0.12));
    }
    .sprite-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
    }
    .rabbit {
      left: 114px;
      top: 1022px;
      width: 210px;
      height: 210px;
    }
    .apple {
      left: 415px;
      top: 792px;
      width: 250px;
      height: 250px;
    }
    .stick {
      left: 338px;
      top: 1006px;
      width: 390px;
      height: 390px;
    }
    .caption {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 58px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: 0;
      color: #735018;
      text-shadow: 0 3px 0 rgba(255, 248, 222, 0.55);
    }
    .caption-path { top: 1276px; }
    .caption-apple { top: 1126px; }
    .caption-stick { top: 1274px; }
    .glyph-card {
      position: absolute;
      left: 164px;
      right: 164px;
      top: 470px;
      height: 760px;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 52px;
      background: rgba(255, 249, 228, 0.74);
      border: 6px solid rgba(188, 132, 38, 0.18);
      box-shadow: 0 38px 80px rgba(92, 57, 21, 0.14);
      backdrop-filter: blur(2px);
    }
    .glyph {
      font-size: 360px;
      line-height: 0.86;
      font-weight: 900;
      color: #5b351f;
    }
    .pinyin {
      margin-top: 46px;
      font-size: 74px;
      line-height: 1;
      font-weight: 850;
      color: #a46b12;
    }
    .memory-line {
      left: 260px;
      top: 1322px;
      width: 560px;
      height: 34px;
    }
    .final-phrase {
      position: absolute;
      left: 0;
      top: 1416px;
      width: 100%;
      text-align: center;
      font-size: 64px;
      line-height: 1.15;
      font-weight: 850;
      color: #714817;
    }
    .tokens {
      position: absolute;
      left: 132px;
      right: 132px;
      bottom: 166px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    .token {
      min-height: 92px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: rgba(255, 250, 232, 0.72);
      border: 4px solid rgba(165, 108, 27, 0.14);
      color: #765226;
      font-size: 34px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div
    id="yi-agent-pipeline-test"
    class="stage"
    data-composition-id="yi-agent-pipeline-test"
    data-start="0"
    data-width="1080"
    data-height="1920"
    data-duration="7.8"
  >
    <img
      id="meadow-path-plate"
      class="clip plate"
      data-start="0"
      data-duration="7.8"
      data-track-index="0"
      src="assets/unit-01/yi-agent-pipeline-test/plates/meadow-path-plate.png"
      alt=""
    />
    <div
      id="paper-grain"
      class="clip paper-grain"
      data-start="0"
      data-duration="7.8"
      data-track-index="1"
      aria-hidden="true"
    ></div>
    <div
      id="opening-title"
      class="clip stage-title"
      data-start="0"
      data-duration="2"
      data-track-index="2"
    >平平一条线</div>

    <section
      id="path-hook-scene"
      class="clip path-scene"
      data-start="0.25"
      data-duration="2.05"
      data-track-index="3"
      aria-label="一条小路"
    >
      <div class="path-highlight"></div>
      <div class="caption caption-path">一条小路</div>
    </section>

    <div
      id="rabbit-hop-sprite"
      class="clip sprite rabbit"
      data-start="0.35"
      data-duration="1.85"
      data-track-index="4"
      aria-hidden="true"
    >
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/rabbit/hop/frame-000.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/rabbit/hop/frame-001.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/rabbit/hop/frame-002.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/rabbit/hop/frame-003.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/rabbit/hop/frame-004.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/rabbit/hop/frame-005.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/rabbit/hop/frame-006.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/rabbit/hop/frame-007.png" alt="" />
    </div>

    <section
      id="apple-settle-scene"
      class="clip apple-scene"
      data-start="2.1"
      data-duration="1.85"
      data-track-index="5"
      aria-label="一个苹果"
    >
      <div class="sprite apple">
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/apple/settle/frame-000.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/apple/settle/frame-001.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/apple/settle/frame-002.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/apple/settle/frame-003.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/apple/settle/frame-004.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/apple/settle/frame-005.png" alt="" />
      </div>
      <div class="caption caption-apple">一个苹果</div>
    </section>

    <section
      id="stick-roll-flat-scene"
      class="clip stick-scene"
      data-start="3.75"
      data-duration="1.85"
      data-track-index="6"
      aria-label="一根木棒"
    >
      <div class="sprite stick">
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/stick/roll-flat/frame-000.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/stick/roll-flat/frame-001.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/stick/roll-flat/frame-002.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/stick/roll-flat/frame-003.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/stick/roll-flat/frame-004.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/stick/roll-flat/frame-005.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/stick/roll-flat/frame-006.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-agent-pipeline-test/sprites/stick/roll-flat/frame-007.png" alt="" />
      </div>
      <div class="caption caption-stick">一根木棒</div>
    </section>

    <section
      id="glyph-close-scene"
      class="clip glyph-scene"
      data-start="5.35"
      data-duration="2.45"
      data-track-index="7"
      aria-label="都是一"
    >
      <div class="glyph-card">
        <div>
          <div class="glyph">一</div>
          <div class="pinyin">yi</div>
        </div>
      </div>
      <div class="memory-line"></div>
      <div class="final-phrase">都是一</div>
      <div class="tokens" aria-hidden="true">
        <div class="token">小路</div>
        <div class="token">苹果</div>
        <div class="token">木棒</div>
      </div>
    </section>

    <audio
      id="narration-audio"
      class="clip"
      data-start="0"
      data-duration="7.8"
      data-track-index="20"
      src="assets/audio/yi-agent-narration.mp3"
      preload="auto"
    ></audio>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const timeline = gsap.timeline({ paused: true });
    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const ease = (value) => 1 - Math.pow(1 - clamp(value), 3);
    const range = (time, start, length) => clamp((time - start) / length);
    const setOpacity = (selector, value) => {
      document.querySelectorAll(selector).forEach((el) => {
        el.style.opacity = String(clamp(value));
      });
    };
    const setTransform = (selector, parts) => {
      const x = parts.x || 0;
      const y = parts.y || 0;
      const scale = parts.scale == null ? 1 : parts.scale;
      const rotation = parts.rotation || 0;
      document.querySelectorAll(selector).forEach((el) => {
        el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) scale(" + scale.toFixed(3) + ") rotate(" + rotation.toFixed(2) + "deg)";
      });
    };
    const setScaleX = (selector, value) => {
      document.querySelectorAll(selector).forEach((el) => {
        el.style.transform = "scaleX(" + clamp(value).toFixed(3) + ")";
      });
    };
    const showSpriteFrame = (selector, time, start, length, frameCount) => {
      const frames = gsap.utils.toArray(selector + " .sprite-frame");
      const progress = range(time, start, length);
      const index = Math.min(frameCount - 1, Math.floor(progress * frameCount));
      frames.forEach((frame, frameIndex) => {
        frame.style.opacity = frameIndex === index ? "1" : "0";
      });
    };

    timeline.add((time) => {
      setOpacity(".stage-title", 1 - range(time, 1.65, 0.45));
      setOpacity(".path-scene", ease(range(time, 0.25, 0.22)) * (1 - range(time, 2.02, 0.28)));
      setScaleX(".path-highlight", ease(range(time, 0.55, 0.75)));
      showSpriteFrame(".rabbit", time, 0.35, 1.55, 8);
      setTransform(".rabbit", {
        x: 18 * ease(range(time, 0.35, 1.55)),
        y: -34 * Math.sin(Math.PI * range(time, 0.35, 1.55)),
        scale: 1,
        rotation: -3 + 7 * Math.sin(Math.PI * range(time, 0.35, 1.55))
      });

      setOpacity(".apple-scene", ease(range(time, 2.1, 0.22)) * (1 - range(time, 3.72, 0.25)));
      showSpriteFrame(".apple", time, 2.25, 1.05, 6);
      setTransform(".apple", {
        y: -26 * (1 - ease(range(time, 2.25, 1.05))),
        scale: 1,
        rotation: -3 + 6 * Math.sin(Math.PI * range(time, 2.25, 1.05))
      });

      setOpacity(".stick-scene", ease(range(time, 3.75, 0.22)) * (1 - range(time, 5.32, 0.25)));
      showSpriteFrame(".stick", time, 3.9, 1.15, 8);
      setTransform(".stick", {
        y: -8 * Math.sin(Math.PI * range(time, 3.9, 1.15)),
        scale: 1,
        rotation: 0
      });

      setOpacity(".glyph-scene", ease(range(time, 5.35, 0.45)));
      setScaleX(".memory-line", ease(range(time, 5.55, 0.65)));
      setTransform(".glyph-card", {
        y: 18 * (1 - ease(range(time, 5.35, 0.55))),
        scale: 0.94 + 0.06 * ease(range(time, 5.35, 0.55)),
        rotation: 0
      });
      setOpacity(".final-phrase", ease(range(time, 6.35, 0.35)));
      setOpacity(".tokens", ease(range(time, 6.9, 0.35)));
    });

    timeline.seek(0);
    window.__timelines["yi-agent-pipeline-test"] = timeline;
  </script>
</body>
</html>
