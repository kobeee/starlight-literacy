<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <link rel="icon" href="data:," />
  <title>一 - Sunrise Line V1</title>
  <script src="assets/runtime/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      margin: 0;
      overflow: hidden;
      background: #f7ead4;
      font-family: "Noto Sans SC", sans-serif;
      color: #5a3422;
    }
    .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #f7ead4; }
    .clip { position: absolute; }
    .plate { inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
    .grain {
      inset: 0;
      opacity: 0.10;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(93, 68, 38, 0.10) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 46%, rgba(93, 68, 38, 0.07) 0 1px, transparent 1.5px);
      background-size: 43px 43px, 71px 71px;
    }
    .scene { inset: 0; width: 100%; height: 100%; opacity: 0; }
    .cue {
      position: absolute;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 62px;
      line-height: 1.08;
      font-weight: 850;
      letter-spacing: 0;
      color: #6a4517;
      text-shadow: 0 3px 0 rgba(255, 248, 220, 0.62);
    }
    .cue-sun { top: 1188px; }
    .cue-light { top: 1192px; }
    .cue-flat { top: 1188px; }
    .focus {
      position: absolute;
      left: 130px;
      right: 130px;
      top: 852px;
      height: 330px;
      border-radius: 170px;
      background: rgba(255, 242, 192, 0.22);
      border: 4px solid rgba(170, 118, 34, 0.09);
    }
    .horizon-line,
    .memory-line,
    .final-line {
      position: absolute;
      left: 216px;
      top: 1010px;
      width: 648px;
      height: 32px;
      border-radius: 999px;
      transform-origin: 0 50%;
      background:
        linear-gradient(180deg, rgba(255, 252, 205, 0.94), rgba(255, 226, 96, 0.25)),
        linear-gradient(90deg, #f7cb52, #d89a15);
      box-shadow: 0 0 0 18px rgba(249, 200, 73, 0.11), 0 22px 32px rgba(92, 57, 21, 0.10);
    }
    .memory-line { top: 1010px; height: 36px; }
    .sprite {
      position: absolute;
      width: 256px;
      height: 256px;
      transform-origin: 50% 72%;
      filter: drop-shadow(0 18px 22px rgba(90, 52, 34, 0.12));
    }
    .sprite-frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; }
    .sun { left: 390px; top: 718px; width: 300px; height: 300px; }
    .light { left: 390px; top: 888px; width: 300px; height: 300px; filter: drop-shadow(0 14px 16px rgba(131, 92, 18, 0.10)); }
    .glyph-card {
      position: absolute;
      left: 166px;
      right: 166px;
      top: 414px;
      height: 804px;
      display: grid;
      place-items: center;
      border-radius: 46px;
      background: rgba(255, 250, 230, 0.80);
      border: 6px solid rgba(188, 132, 38, 0.17);
      box-shadow: 0 38px 80px rgba(92, 57, 21, 0.13);
      text-align: center;
    }
    .glyph { font-size: 390px; line-height: 0.82; font-weight: 900; color: #5b351f; }
    .pinyin { margin-top: 48px; font-size: 76px; line-height: 1; font-weight: 850; color: #9f6812; }
    .final-line { top: 1306px; height: 36px; }
    .final-phrase {
      position: absolute;
      left: 0;
      top: 1402px;
      width: 100%;
      text-align: center;
      font-size: 68px;
      line-height: 1.15;
      font-weight: 850;
      color: #714817;
    }
  </style>
</head>
<body>
  <div id="yi-sunrise-line-v1" class="stage" data-composition-id="yi-sunrise-line-v1" data-start="0" data-width="1080" data-height="1920" data-duration="7.4">
    <img id="morning-field-plate" class="clip plate" data-start="0" data-duration="7.4" data-track-index="0" src="assets/unit-01/yi-sunrise-line-v1/plates/morning-field-plate.png" alt="" />
    <div id="paper-grain" class="clip grain" data-start="0" data-duration="7.4" data-track-index="1" aria-hidden="true"></div>

    <section id="sun-meaning-scene" class="clip scene sun-scene" data-start="0" data-duration="1.95" data-track-index="2" aria-label="一个太阳">
      <div class="focus"></div>
      <div class="sprite sun">
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-000.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-001.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-002.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-003.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-004.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-005.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-006.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-007.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-008.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/sun/rise-glow/frame-009.png" alt="" />
      </div>
      <div class="cue cue-sun">一个太阳</div>
    </section>

    <section id="light-binding-scene" class="clip scene light-scene" data-start="1.72" data-duration="1.88" data-track-index="3" aria-label="一条光线">
      <div class="focus"></div>
      <div class="sprite light">
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/light/line-unfold/frame-000.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/light/line-unfold/frame-001.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/light/line-unfold/frame-002.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/light/line-unfold/frame-003.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/light/line-unfold/frame-004.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/light/line-unfold/frame-005.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/light/line-unfold/frame-006.png" alt="" />
        <img class="sprite-frame" src="assets/unit-01/yi-sunrise-line-v1/sprites/light/line-unfold/frame-007.png" alt="" />
      </div>
      <div class="cue cue-light">一条光线</div>
    </section>

    <section id="flat-line-scene" class="clip scene flat-scene" data-start="3.38" data-duration="1.9" data-track-index="4" aria-label="平平一横">
      <div class="focus"></div>
      <div class="memory-line"></div>
      <div class="cue cue-flat">平平一横</div>
    </section>

    <section id="glyph-close-scene" class="clip scene glyph-scene" data-start="5.06" data-duration="2.34" data-track-index="5" aria-label="就是一">
      <div class="glyph-card">
        <div>
          <div class="glyph">一</div>
          <div class="pinyin">yi</div>
        </div>
      </div>
      <div class="final-line"></div>
      <div class="final-phrase">就是一</div>
    </section>

    <audio id="narration-audio" class="clip" data-start="0" data-duration="7.4" data-track-index="20" src="assets/audio/yi-sunrise-line-v1-narration.mp3" preload="auto"></audio>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const timeline = gsap.timeline({ paused: true });
    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const ease = (value) => 1 - Math.pow(1 - clamp(value), 3);
    const range = (time, start, length) => clamp((time - start) / length);
    const setOpacity = (selector, value) => {
      document.querySelectorAll(selector).forEach((el) => { el.style.opacity = String(clamp(value)); });
    };
    const setTransform = (selector, parts) => {
      const x = parts.x || 0;
      const y = parts.y || 0;
      const scale = parts.scale == null ? 1 : parts.scale;
      const rotation = parts.rotation || 0;
      document.querySelectorAll(selector).forEach((el) => {
        el.style.transform = "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) scale(" + scale.toFixed(3) + ") rotate(" + rotation.toFixed(2) + "deg)";
      });
    };
    const setScaleX = (selector, value) => {
      document.querySelectorAll(selector).forEach((el) => { el.style.transform = "scaleX(" + clamp(value).toFixed(3) + ")"; });
    };
    const showSpriteFrame = (selector, time, start, length, frameCount) => {
      const frames = gsap.utils.toArray(selector + " .sprite-frame");
      const progress = range(time, start, length);
      const index = Math.min(frameCount - 1, Math.floor(progress * frameCount));
      frames.forEach((frame, frameIndex) => { frame.style.opacity = frameIndex === index ? "1" : "0"; });
    };

    timeline.add((time) => {
      setOpacity(".sun-scene", ease(range(time, 0.0, 0.22)) * (1 - range(time, 1.86, 0.26)));
      showSpriteFrame(".sun-scene .sun", time, 0.1, 1.65, 10);
      setTransform(".sun-scene .sun", {
        y: -62 * ease(range(time, 0.1, 1.65)),
        scale: 0.94 + 0.08 * ease(range(time, 0.1, 1.65)),
        rotation: 0
      });

      setOpacity(".light-scene", ease(range(time, 1.72, 0.24)) * (1 - range(time, 3.48, 0.28)));
      showSpriteFrame(".light-scene .light", time, 1.82, 1.45, 8);
      setTransform(".light-scene .light", {
        x: -8 + 16 * ease(range(time, 1.82, 1.45)),
        y: 0,
        scale: 1.08,
        rotation: 0
      });

      setOpacity(".flat-scene", ease(range(time, 3.36, 0.24)) * (1 - range(time, 5.02, 0.28)));
      setScaleX(".flat-scene .memory-line", ease(range(time, 3.48, 0.72)));

      setOpacity(".glyph-scene", ease(range(time, 5.06, 0.38)));
      setScaleX(".final-line", ease(range(time, 5.22, 0.62)));
      setTransform(".glyph-card", {
        y: 18 * (1 - ease(range(time, 5.06, 0.5))),
        scale: 0.94 + 0.06 * ease(range(time, 5.06, 0.5)),
        rotation: 0
      });
      setOpacity(".final-phrase", ease(range(time, 5.48, 0.35)));
    });

    timeline.seek(0);
    window.__timelines["yi-sunrise-line-v1"] = timeline;
  </script>
</body>
</html>
