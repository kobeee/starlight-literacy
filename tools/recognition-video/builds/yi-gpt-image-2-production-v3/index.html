    /* Tianzige (田字格) — semi-transparent warm-brown grid that
       frames the kaiti 一 glyph. Outer frame at 32% alpha, inner
       cross at 22% alpha so the frame reads more clearly than the
       midlines without obscuring the pastoral plate behind. */
    .tianzige {
      position: absolute;
      left: 260px;
      top: 820px;
      width: 560px;
      height: 560px;
      border: 3px solid rgba(93, 74, 54, 0.45);
      border-radius: 14px;
      background: transparent;
      box-shadow: 0 2px 12px rgba(80, 50, 20, 0.08);
      opacity: 0;
      pointer-events: none;
    }
    .tianzige::before,
    .tianzige::after {
      content: "";
      position: absolute;
      background: rgba(93, 74, 54, 0.32);
    }
    /* horizontal midline */
    .tianzige::before {
      left: 0;
      right: 0;
      top: 50%;
      height: 1.5px;
      transform: translateY(-0.75px);
    }
    /* vertical midline */
    .tianzige::after {
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1.5px;
      transform: translateX(-0.75px);
    }

    /* The big final 一 glyph is rendered with LXGW WenKai (kaiti)
       loaded via @font-face above. The flex container is sized to
       match the tianzige so the character is geometrically centered
       inside the grid. */

      left: 260px;
      top: 820px;
      width: 560px;
      height: 560px;

      top: 820px;

    .glyph-write {

      opacity: 0;
      pointer-events: none;
      clip-path: inset(0 100% 0 0);

  <script>
    window.__timelines = window.__timelines || {};
    const timeline = gsap.timeline({ paused: true });

    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const ease = (value) => 1 - Math.pow(1 - clamp(value), 3);
    const easeInOut = (value) => {
      const t = clamp(value);
      return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    };
    const range = (time, start, length) => clamp((time - start) / length);

    const setOpacity = (selector, value) => {
      document.querySelectorAll(selector).forEach((el) => {
        el.style.opacity = String(clamp(value));
      });
    };

    const setStyle = (selector, prop, value) => {
      document.querySelectorAll(selector).forEach((el) => {
        el.style[prop] = value;
      });
    };

    const setTransform = (selector, parts) => {
      const x = parts.x || 0;
      const y = parts.y || 0;
      const scale = parts.scale == null ? 1 : parts.scale;
      const scaleX = parts.scaleX == null ? scale : parts.scaleX;
      const scaleY = parts.scaleY == null ? scale : parts.scaleY;
      document.querySelectorAll(selector).forEach((el) => {
        el.style.transform =
          "translate(" + x.toFixed(2) + "px," + y.toFixed(2) + "px) " +
          "scale(" + scaleX.toFixed(3) + "," + scaleY.toFixed(3) + ")";
      });
    };

    const showSpriteFrame = (selector, time, start, length, frameCount) => {
      const frames = gsap.utils.toArray(selector + " .sprite-frame");
      const t = range(time, start, length);
      const idx = Math.min(frameCount - 1, Math.floor(t * frameCount));
      frames.forEach((frame, frameIndex) => {
        frame.style.opacity = frameIndex === idx ? "1" : "0";
      });
    };

    // HyperFrames drives `timeline.totalTime(t, false)` once per captured
    // frame. With a 0-duration timeline (no real tweens, only this `.add`
    // callback at position 0), GSAP's `totalTime` setter forces a full
    // re-render on every call because of the `!this._dur && totalTime`
    // branch — which fires this callback on every seek. The composition
    // duration is driven by the root `data-duration="10"`, so HyperFrames
    // ticks from 0 → 10s independent of the GSAP timeline's own duration.
    // Do NOT add a dummy `.to(...)` to extend timeline duration; that
    // switches GSAP to crossing-based semantics and the callback only fires
    // once at t=0.
    timeline.add((time) => {
      // sun container fade in + rise
      const sunFadeIn = ease(range(time, 0.05, 0.35));
      // sun dims to 0.55 during flat-line shot (brief: 0.55) and holds through glyph
      const sunDim = clamp(1 - 0.45 * ease(range(time, 3.305, 0.5)));
      setOpacity("#sun-sprite", sunFadeIn * sunDim);

      // sun rise: y translates from +60 to 0 in the first 1.0s, then breathes slightly
      const riseProgress = ease(range(time, 0.05, 1.0));
      const breathe = Math.sin((time - 1.0) * 1.8) * 4 * clamp(range(time, 1.0, 0.4));
      setTransform("#sun-sprite", {
        x: 0,
        y: 60 * (1 - riseProgress) + breathe,
        scale: 0.96 + 0.04 * riseProgress,
      });

      // sun sprite frame swap: 10 frames over 1.0s (0.05 - 1.05), then hold last
      showSpriteFrame("#sun-sprite", time, 0.05, 1.0, 10);

      // ------- SHOT 2 (1.638 - 3.305): golden light beam opens horizontally -------
      // beam fades in quickly then scaleX 0 -> 1 from center
      const beamIn = ease(range(time, 1.638, 0.24));
      // beam fades out as it morphs into flat-line at shot 3 start
      const beamOut = ease(range(time, 3.305, 0.35));
      setOpacity("#light-beam", beamIn * (1 - beamOut));
      const beamScale = easeInOut(range(time, 1.638, 1.1));
      // gentle pulse after fully open
      const beamPulse = 1 + 0.015 * Math.sin((time - 2.7) * 3.2) * clamp(range(time, 2.7, 0.4));
      setTransform("#light-beam", {
        scaleX: beamScale * beamPulse,
        scaleY: 1,
      });

      // ------- SHOT 3 (3.305 - 5.041): light settles as solid flat horizontal stroke -------
      // plate veil fades in to 0.18 to dim background
      const veilLevel = 0.18 * ease(range(time, 3.305, 0.5));
      setOpacity("#plate-veil", veilLevel);

      // flat-line rect fades in and scales from 0 -> full width
      const flatIn = ease(range(time, 3.305, 0.45));
      // flat-line fully fades as the big 一 glyph takes over the visual center
      const flatHandoff = ease(range(time, 5.2, 0.55));
      setOpacity("#flat-line-rect", flatIn * (1 - flatHandoff));
      const flatScaleX = easeInOut(range(time, 3.305, 0.8));
      setTransform("#flat-line-rect", {
        scaleX: flatScaleX,
        scaleY: 1,
      });

      // ------- SHOT 3.5 (3.3 - 7.4): tianzige (田字格) fades in -------
      // Grid fades to 0.85 opacity as the flat-line stabilizes, so by
      // the time the kaiti 一 appears the writing frame is already there.
      // In SHOT 5 (>=7.4s) the tianzige cross-fades into mizige.
      const gridIn = ease(range(time, 3.3, 0.7));
      const tianzigeHandoff = ease(range(time, 7.4, 0.3));
      setOpacity("#tianzige", gridIn * 0.85 * (1 - tianzigeHandoff));

      // ------- SHOT 4 (5.041 - 7.4): glyph closure -------
      // The kaiti 一 fades in and gently scales from 0.94 -> 1.0 inside
      // the tianzige. The flat-line dims out simultaneously (see above)
      // so visually the golden stroke "settles into" the calligraphic 一.
      // The brown kaiti 一 also fades out in SHOT 5 (>=7.4s) so the
      // black stroke-order demo can take over.
      const glyphIn = ease(range(time, 5.041, 0.55));
      setOpacity("#glyph-yi", glyphIn * (1 - tianzigeHandoff));
      const glyphScale = 0.94 + 0.06 * glyphIn;
      setTransform("#glyph-yi", {
        x: 0,
        y: 0,
        scale: glyphScale,
      });

      // pinyin fades in slightly after glyph; held through SHOT 5 to
      // give the writing demo persistent phonetic context.
      const pinyinIn = ease(range(time, 5.25, 0.45));
      setOpacity("#glyph-pinyin", pinyinIn);
      setTransform("#glyph-pinyin", {
        x: 0,
        y: 10 * (1 - pinyinIn),
        scale: 1,
      });

      // sentence strip fades in last, at 0.85 opacity; held through SHOT 5
      // so the four-part jingle stays on screen during the writing demo.
      const sentenceIn = ease(range(time, 5.5, 0.55));
      setOpacity("#sentence-strip", sentenceIn * 0.85);
      setTransform("#sentence-strip", {
        x: 0,
        y: 14 * (1 - sentenceIn),
        scale: 1,
      });

      // ------- SHOT 5 (7.4 - 10.0): mizige paper card + stroke-order writing -------
      // 7.4 - 7.7s: tianzige + brown 一 cross-fade out (above).
      // 7.7 - 8.2s: mizige paper card fades in and scales 0.95 -> 1.0
      //             over the same geometric box as tianzige.
      const mizigeIn = ease(range(time, 7.7, 0.5));
      setOpacity("#mizige", mizigeIn);
      setTransform("#mizige", {
        x: 0,
        y: 0,
        scale: 0.95 + 0.05 * mizigeIn,
      });

      // 8.2 - 9.2s: black kaiti 一 writes itself left-to-right via
      //             clip-path inset, simulating a single brush stroke.
      //             Opacity ramps up quickly at the start so the first
      //             pixels of the stroke are visible immediately.
      const writeProgress = easeInOut(range(time, 8.2, 1.0));
      const writeFade = ease(range(time, 8.2, 0.12));
      setOpacity("#glyph-write", writeFade);
      const insetRight = (1 - writeProgress) * 100;
      setStyle("#glyph-write", "clipPath", "inset(0 " + insetRight.toFixed(2) + "% 0 0)");
      setStyle("#glyph-write", "webkitClipPath", "inset(0 " + insetRight.toFixed(2) + "% 0 0)");

      // 9.2 - 10.0s: hold the complete frame (mizige + black 一 + pinyin
      //              + sentence strip) so the poster-quality final frame
      //              reads cleanly for ~0.8s.
    });

    timeline.seek(0);
    window.__timelines["yi-gpt-image-2-production-v3"] = timeline;
  </script>
</body>
</html>
