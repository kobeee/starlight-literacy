<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #faf6f0;
        color: #5d4a36;
        font-family: "Noto Sans SC", sans-serif;
      }

      #root {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 8%, rgba(255, 222, 126, 0.82) 0 11%, transparent 31%),
          linear-gradient(180deg, #fff4d8 0%, #fff9ed 47%, #eef4dc 100%);
      }

      .paper-grain,
      .generated-backdrop,
      .sun-soft,
      .cloud,
      .animal-companion,
      .meadow,
      .path-scene,
      .apple-scene,
      .stick-scene,
      .glyph-scene,
      .final-scene {
        position: absolute;
      }

      .paper-grain {
        inset: 0;
        opacity: 0.14;
        background-image:
          radial-gradient(circle at 16% 24%, rgba(134, 94, 42, 0.08) 0 1px, transparent 1.5px),
          radial-gradient(circle at 68% 46%, rgba(93, 74, 54, 0.06) 0 1px, transparent 1.5px);
        background-size: 34px 34px, 51px 51px;
      }

      .generated-backdrop {
        inset: 0;
        width: 1280px;
        height: 800px;
        object-fit: cover;
        opacity: 0.62;
        filter: saturate(0.9) contrast(0.92) brightness(1.03);
      }

      .sun-soft {
        left: 500px;
        top: 30px;
        width: 280px;
        height: 280px;
        border-radius: 50%;
        background: rgba(255, 228, 145, 0.66);
        box-shadow: 0 26px 92px rgba(229, 166, 63, 0.18);
      }

      .cloud {
        width: 176px;
        height: 50px;
        border-radius: 999px;
        background: rgba(255, 255, 246, 0.78);
        box-shadow:
          38px -18px 0 8px rgba(255, 255, 246, 0.72),
          86px -7px 0 4px rgba(255, 255, 246, 0.68);
      }

      .cloud-a {
        left: 106px;
        top: 118px;
      }

      .cloud-b {
        right: 142px;
        top: 128px;
        transform: scale(0.8);
      }

      .animal-companion {
        width: 96px;
        height: auto;
        opacity: 0;
        transform-origin: 50% 100%;
        filter: drop-shadow(0 14px 12px rgba(93, 74, 54, 0.12));
      }

      .animal-rabbit {
        right: 106px;
        bottom: 142px;
        width: 92px;
      }

      .animal-bluebird {
        left: 146px;
        top: 216px;
        width: 76px;
      }

      .animal-squirrel {
        left: 116px;
        bottom: 124px;
        width: 86px;
      }

      .animal-ducklings {
        right: 238px;
        bottom: 92px;
        width: 80px;
      }

      .meadow {
        left: -92px;
        right: -92px;
        bottom: -148px;
        height: 338px;
        border-radius: 56% 56% 0 0 / 28% 28% 0 0;
        background: linear-gradient(180deg, #d8e8c5 0%, #eef4dc 54%, #f7e6c4 100%);
        border-top: 4px solid rgba(140, 174, 105, 0.24);
      }

      .stage-title {
        position: absolute;
        left: 0;
        top: 82px;
        width: 100%;
        text-align: center;
        color: #7b5200;
        font-size: 42px;
        font-weight: 900;
      }

      .path-scene,
      .apple-scene,
      .stick-scene,
      .glyph-scene,
      .final-scene {
        inset: 0;
      }

      .path-line {
        position: absolute;
        left: 332px;
        top: 392px;
        width: 616px;
        height: 70px;
        border-radius: 999px;
        background:
          repeating-linear-gradient(90deg, rgba(255, 250, 236, 0.42) 0 34px, transparent 34px 68px),
          linear-gradient(90deg, #d8b06a, #f0c77a 44%, #d8b06a);
        border: 8px solid rgba(139, 94, 0, 0.16);
        box-shadow: 0 18px 26px rgba(118, 86, 44, 0.12);
      }

      .path-one-mark,
      .apple-one-mark,
      .stick-one-mark,
      .memory-line {
        position: absolute;
        height: 18px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(255, 244, 192, 0.7), transparent 54%),
          linear-gradient(90deg, #f9c83c, #e8a800 54%, #d89400);
        box-shadow:
          0 10px 0 rgba(139, 94, 0, 0.06),
          0 0 0 10px rgba(255, 201, 71, 0.1);
        transform-origin: 0 50%;
      }

      .path-one-mark {
        left: 380px;
        top: 418px;
        width: 520px;
      }

      .apple {
        position: absolute;
        left: 548px;
        top: 246px;
        width: 184px;
        height: 172px;
      }

      .apple-body {
        position: absolute;
        left: 16px;
        top: 28px;
        width: 152px;
        height: 136px;
        border-radius: 58% 58% 55% 55% / 52% 52% 62% 62%;
        background:
          radial-gradient(circle at 34% 28%, rgba(255, 232, 204, 0.78) 0 9%, transparent 24%),
          linear-gradient(150deg, #ff8f72 0%, #e8574c 58%, #c94a42 100%);
        border: 5px solid rgba(139, 75, 49, 0.18);
        box-shadow: 0 18px 22px rgba(126, 72, 44, 0.18);
      }

      .apple-stem {
        position: absolute;
        left: 88px;
        top: 4px;
        width: 18px;
        height: 42px;
        border-radius: 10px 10px 4px 4px;
        background: #8f6a39;
        transform: rotate(10deg);
      }

      .apple-leaf {
        position: absolute;
        left: 104px;
        top: 10px;
        width: 58px;
        height: 31px;
        border-radius: 90% 12% 88% 15%;
        background: #7eae64;
        transform: rotate(-18deg);
      }

      .apple-one-mark {
        left: 510px;
        top: 454px;
        width: 260px;
      }

      .stick {
        position: absolute;
        left: 430px;
        top: 404px;
        width: 420px;
        height: 58px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(255, 238, 175, 0.62), transparent 52%),
          linear-gradient(90deg, #b98242, #d6a25b 50%, #a96f36);
        border: 6px solid rgba(116, 72, 41, 0.18);
        box-shadow: 0 18px 24px rgba(93, 74, 54, 0.14);
        transform-origin: 50% 50%;
      }

      .stick-one-mark {
        left: 350px;
        top: 524px;
        width: 580px;
      }

      .glyph-board {
        position: absolute;
        left: 206px;
        top: 154px;
        width: 868px;
        height: 398px;
        border-radius: 48px;
        background:
          linear-gradient(90deg, transparent calc(50% - 2px), rgba(139, 94, 0, 0.11) 0 calc(50% + 2px), transparent 0),
          linear-gradient(180deg, transparent calc(50% - 2px), rgba(139, 94, 0, 0.11) 0 calc(50% + 2px), transparent 0),
          linear-gradient(180deg, rgba(255, 250, 236, 0.91), rgba(255, 250, 236, 0.98));
        border: 5px solid rgba(255, 201, 71, 0.5);
        box-shadow: 0 24px 64px rgba(139, 94, 0, 0.12);
      }

      .glyph-stroke {
        position: absolute;
        left: 274px;
        top: 326px;
        width: 732px;
        height: 78px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(255, 233, 130, 0.56), transparent 48%),
          linear-gradient(90deg, #f5b925 0%, #e8a800 52%, #d89400 100%);
        box-shadow:
          0 18px 0 rgba(139, 94, 0, 0.08),
          0 0 0 18px rgba(255, 201, 71, 0.12);
        transform-origin: 0 50%;
      }

      .pinyin-chip {
        position: absolute;
        right: 202px;
        top: 186px;
        width: 138px;
        height: 68px;
        border-radius: 34px;
        display: grid;
        place-items: center;
        background: rgba(255, 250, 236, 0.94);
        border: 3px solid #eadfce;
        color: #7a6a55;
        font-size: 46px;
        font-weight: 900;
      }

      .memory-row {
        position: absolute;
        left: 368px;
        top: 590px;
        width: 544px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .memory-token {
        position: relative;
        width: 150px;
        height: 60px;
        border-radius: 30px;
        background: rgba(255, 250, 236, 0.86);
        border: 3px solid rgba(234, 223, 206, 0.84);
        box-shadow: 0 10px 20px rgba(112, 84, 48, 0.08);
      }

      .memory-line {
        left: 25px;
        right: 25px;
        top: 26px;
        height: 10px;
      }

      .memory-apple {
        position: absolute;
        left: 64px;
        top: 8px;
        width: 23px;
        height: 25px;
        border-radius: 52% 52% 58% 58%;
        background: #e8574c;
      }

      .memory-apple::before {
        content: "";
        position: absolute;
        left: 11px;
        top: -7px;
        width: 5px;
        height: 10px;
        border-radius: 4px;
        background: #8f6a39;
      }

      .memory-path {
        background:
          repeating-linear-gradient(90deg, rgba(255, 250, 236, 0.72) 0 16px, transparent 16px 32px),
          #e8a800;
      }

      .memory-stick {
        background: linear-gradient(90deg, #b98242, #e8a800 52%, #a96f36);
      }

      .label {
        position: absolute;
        min-width: 222px;
        height: 68px;
        padding: 0 30px;
        border-radius: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 250, 236, 0.94);
        border: 4px solid #eadfce;
        color: #7b5200;
        font-size: 36px;
        font-weight: 900;
        box-shadow: 0 12px 26px rgba(112, 84, 48, 0.1);
      }

      .path-label {
        left: 528px;
        top: 292px;
      }

      .apple-label {
        left: 528px;
        top: 500px;
      }

      .stick-label {
        left: 526px;
        top: 292px;
      }

      .final-cue {
        left: 492px;
        top: 680px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5.8"
      data-width="1280"
      data-height="800"
    >
      <img
        id="generated-backdrop"
        class="clip generated-backdrop"
        data-start="0"
        data-duration="5.8"
        data-track-index="20"
        src="./assets/unit-01/yi/yi-stage-bg-v1.png"
        alt=""
      />
      <div id="paper-grain" class="clip paper-grain" data-start="0" data-duration="5.8" data-track-index="0"></div>
      <div id="sun-soft" class="clip sun-soft" data-start="0" data-duration="5.8" data-track-index="1"></div>
      <div id="cloud-a" class="clip cloud cloud-a" data-start="0" data-duration="5.8" data-track-index="2"></div>
      <div id="cloud-b" class="clip cloud cloud-b" data-start="0" data-duration="5.8" data-track-index="3"></div>
      <div id="meadow" class="clip meadow" data-start="0" data-duration="5.8" data-track-index="4"></div>
      <div id="stage-title" class="clip stage-title" data-start="0.18" data-duration="4.85" data-track-index="5">一条小路，变成平平的“一”</div>
      <img
        id="animal-rabbit"
        class="clip animal-companion animal-rabbit"
        data-start="0.15"
        data-duration="5.65"
        data-track-index="10"
        src="./assets/animals/rabbit.png"
        alt=""
      />
      <img
        id="animal-bluebird"
        class="clip animal-companion animal-bluebird"
        data-start="0.2"
        data-duration="5.6"
        data-track-index="11"
        src="./assets/animals/bluebird.png"
        alt=""
      />
      <img
        id="animal-squirrel"
        class="clip animal-companion animal-squirrel"
        data-start="1.45"
        data-duration="4.35"
        data-track-index="12"
        src="./assets/animals/squirrel.png"
        alt=""
      />
      <img
        id="animal-ducklings"
        class="clip animal-companion animal-ducklings"
        data-start="2.35"
        data-duration="3.45"
        data-track-index="13"
        src="./assets/animals/ducklings.png"
        alt=""
      />

      <div id="path-scene" class="clip path-scene" data-start="0.25" data-duration="1.65" data-track-index="6">
        <div class="path-line"></div>
        <div class="path-one-mark"></div>
        <div class="label path-label">一条小路</div>
      </div>

      <div id="apple-scene" class="clip apple-scene" data-start="1.55" data-duration="1.25" data-track-index="7">
        <div class="apple">
          <div class="apple-stem"></div>
          <div class="apple-leaf"></div>
          <div class="apple-body"></div>
        </div>
        <div class="apple-one-mark"></div>
        <div class="label apple-label">一个苹果</div>
      </div>

      <div id="stick-scene" class="clip stick-scene" data-start="2.55" data-duration="1.2" data-track-index="8">
        <div class="stick"></div>
        <div class="stick-one-mark"></div>
        <div class="label stick-label">一根木棒</div>
      </div>

      <div id="glyph-scene" class="clip glyph-scene" data-start="3.45" data-duration="2.35" data-track-index="9">
        <div class="glyph-board"></div>
        <div class="glyph-stroke"></div>
        <div class="pinyin-chip">yī</div>
        <div class="memory-row">
          <div class="memory-token">
            <div class="memory-apple"></div>
            <div class="memory-line"></div>
          </div>
          <div class="memory-token">
            <div class="memory-line memory-path"></div>
          </div>
          <div class="memory-token">
            <div class="memory-line memory-stick"></div>
          </div>
        </div>
        <div class="label final-cue">都是“一”</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power2.out" } });

      tl.set([".cloud-a", ".cloud-b"], { opacity: 0, y: 10 });
      tl.set(".meadow", { opacity: 0, y: 20 });
      tl.set(".stage-title", { opacity: 0, y: 16 });
      tl.set(".animal-rabbit", { opacity: 0, x: 18, y: 14, scale: 0.92 });
      tl.set(".animal-bluebird", { opacity: 0, x: -16, y: 18, rotation: -5, scale: 0.92 });
      tl.set(".animal-squirrel", { opacity: 0, x: -16, y: 16, scale: 0.9 });
      tl.set(".animal-ducklings", { opacity: 0, x: 28, y: 12, scale: 0.92 });
      tl.set([".path-scene", ".apple-scene", ".stick-scene", ".glyph-scene"], { opacity: 0 });
      tl.set(".path-line", { opacity: 0, scaleX: 0.14, transformOrigin: "0% 50%" });
      tl.set(".path-one-mark", { opacity: 0, scaleX: 0 });
      tl.set(".path-label", { opacity: 0, y: 18 });
      tl.set(".apple", { opacity: 0, scale: 0.78, y: -18 });
      tl.set(".apple-one-mark", { opacity: 0, scaleX: 0 });
      tl.set(".apple-label", { opacity: 0, y: 18 });
      tl.set(".stick", { opacity: 0, scaleX: 0.45, rotation: -6 });
      tl.set(".stick-one-mark", { opacity: 0, scaleX: 0 });
      tl.set(".stick-label", { opacity: 0, y: 18 });
      tl.set(".glyph-board", { opacity: 0, y: 24, scale: 0.97 });
      tl.set(".glyph-stroke", { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" });
      tl.set([".pinyin-chip", ".memory-row", ".final-cue"], { opacity: 0, y: 18 });

      tl.to(".sun-soft", { scale: 1.02, duration: 2.9, repeat: 1, yoyo: true, ease: "sine.inOut" }, 0);
      tl.to([".cloud-a", ".cloud-b"], { opacity: 1, y: 0, duration: 0.5, stagger: 0.1 }, 0.04);
      tl.to(".cloud-a", { x: 12, duration: 5.7, ease: "none" }, 0.06);
      tl.to(".cloud-b", { x: -12, duration: 5.7, ease: "none" }, 0.06);
      tl.to(".meadow", { opacity: 1, y: 0, duration: 0.42 }, 0.06);
      tl.to(".stage-title", { opacity: 1, y: 0, duration: 0.4 }, 0.18);
      tl.to(".animal-rabbit", { opacity: 0.94, x: 0, y: 0, scale: 1, duration: 0.42 }, 0.18);
      tl.to(".animal-rabbit", { x: -14, y: -12, duration: 0.34, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.82);
      tl.to(".animal-bluebird", { opacity: 0.92, x: 0, y: 0, rotation: 0, scale: 1, duration: 0.42 }, 0.32);
      tl.to(".animal-bluebird", { x: 46, rotation: 5, duration: 2.8, ease: "sine.inOut" }, 0.78);
      tl.to(".animal-bluebird", { y: -24, duration: 0.42, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.1);

      tl.to(".path-scene", { opacity: 1, duration: 0.1 }, 0.25);
      tl.to(".path-line", { opacity: 1, scaleX: 1, duration: 0.55, ease: "power3.out" }, 0.34);
      tl.to(".path-one-mark", { opacity: 1, scaleX: 1, duration: 0.42, ease: "power3.out" }, 0.66);
      tl.to(".path-label", { opacity: 1, y: 0, duration: 0.34 }, 0.76);
      tl.to(".path-line", { scale: 1.02, duration: 0.28, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.08);
      tl.to(".path-scene", { opacity: 0, y: -10, duration: 0.32 }, 1.62);

      tl.to(".apple-scene", { opacity: 1, duration: 0.1 }, 1.55);
      tl.to(".animal-squirrel", { opacity: 0.94, x: 0, y: 0, scale: 1, duration: 0.38 }, 1.56);
      tl.to(".animal-squirrel", { rotation: -5, duration: 0.26, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.86);
      tl.to(".apple", { opacity: 1, scale: 1, y: 0, duration: 0.42 }, 1.63);
      tl.to(".apple-one-mark", { opacity: 1, scaleX: 1, duration: 0.38, ease: "power3.out" }, 1.92);
      tl.to(".apple-label", { opacity: 1, y: 0, duration: 0.3 }, 2.04);
      tl.to(".apple", { scale: 1.05, duration: 0.22, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.22);
      tl.to(".apple-scene", { opacity: 0, y: -10, duration: 0.3 }, 2.64);

      tl.to(".stick-scene", { opacity: 1, duration: 0.1 }, 2.55);
      tl.to(".animal-ducklings", { opacity: 0.94, x: 0, y: 0, scale: 1, duration: 0.38 }, 2.56);
      tl.to(".animal-ducklings", { x: -42, y: -4, duration: 2.3, ease: "sine.inOut" }, 2.98);
      tl.to(".stick", { opacity: 1, scaleX: 1, rotation: 0, duration: 0.44, ease: "power3.out" }, 2.64);
      tl.to(".stick-one-mark", { opacity: 1, scaleX: 1, duration: 0.38, ease: "power3.out" }, 2.98);
      tl.to(".stick-label", { opacity: 1, y: 0, duration: 0.3 }, 3.08);
      tl.to(".stick", { y: -14, duration: 0.24, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.22);
      tl.to(".stick-scene", { opacity: 0, y: -10, duration: 0.3 }, 3.48);

      tl.to(".stage-title", { opacity: 0, y: -10, duration: 0.28 }, 3.4);
      tl.to(".glyph-scene", { opacity: 1, duration: 0.1 }, 3.45);
      tl.to(".glyph-board", { opacity: 1, y: 0, scale: 1, duration: 0.42 }, 3.52);
      tl.to(".glyph-stroke", { opacity: 1, scaleX: 1, duration: 0.7, ease: "power3.out" }, 3.78);
      tl.to(".pinyin-chip", { opacity: 1, y: 0, duration: 0.32 }, 4.36);
      tl.to(".memory-row", { opacity: 1, y: 0, duration: 0.34 }, 4.54);
      tl.to(".final-cue", { opacity: 1, y: 0, duration: 0.34 }, 4.84);
      tl.to(".glyph-stroke", { scale: 1.018, duration: 0.28, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.08);
      tl.to([".animal-rabbit", ".animal-squirrel", ".animal-ducklings"], { y: -6, duration: 0.28, yoyo: true, repeat: 1, ease: "sine.inOut" }, 5.02);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
